<!doctype html>
<html lang="en" data-theme="github-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content-Security-Policy: main sends it with this page as a response
      header (src/main/features/window/app-csp.ts), not as a meta tag. A
      header also works in Report-Only, and dev and packaged builds each get
      their own. Keep scripts out of this file: inline code would need a hash
      in the policy's script-src.
    -->
    <!--
      Boot script (public/boot.js) — runs synchronously before first paint
      (FOUC prevention): the theme and window opacity from localStorage.
    -->
    <script src="./boot.js"></script>
    <title>nexus-code</title>
    <link
      rel="preload"
      href="./assets/fonts/JetBrainsMono/JetBrainsMonoNerdFont-Regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./styles/globals.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
