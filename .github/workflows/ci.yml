# CI workflow — runs on PRs into main or develop, pushes to main, and by hand.
# electron-builder는 실행하지 않는다. PR 피드백 시간 최소화가 목적.
# build dry-run은 electron-vite build(out/ 산출)까지만 수행.
#
# Every check runs on each desktop OS the app targets. Whenever bun.lock
# changes, each runner builds node-pty and better-sqlite3 against Electron on
# its own OS, proving the native modules build there.

name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR supersedes the run still going for its last one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install JS dependencies
        # --frozen-lockfile: lockfile 변경을 CI에서 허용하지 않는다.
        # --ignore-scripts skips every install script, ours too. The checks
        # need none of the dependencies' ones, and the costly one was
        # cpu-features (ssh2's optional CPU probe): a node-gyp build of one to
        # two minutes on Windows. Our postinstall is this step's second line
        # and the native module steps below.
        # bash, so a failing line fails the step (pwsh would go on).
        shell: bash
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun x install-electron

      - name: Cache native modules
        # The Electron builds of node-pty and better-sqlite3 depend only on
        # versions bun.lock pins, Electron's among them. A lockfile change
        # builds them again on each OS; otherwise this saves one to two
        # minutes of compiling on Windows.
        id: native-modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules/node-pty/build
            node_modules/better-sqlite3/build
          key: native-modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Build native modules
        # Our postinstall's rebuild without cpu-features, which can't be
        # rebuilt once its install script is skipped.
        if: steps.native-modules.outputs.cache-hit != 'true'
        run: bun x electron-rebuild -f -o node-pty,better-sqlite3

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Test agent
        run: go test ./...

      - name: Resolve Node runtime version
        id: node-runtime
        shell: bash
        run: echo "version=$(bun run scripts/build-agent.ts --print-node-version)" >> "$GITHUB_OUTPUT"

      - name: Cache Node runtimes
        # Downloads from nodejs.org have stalled on runners for minutes on end;
        # a run that finds this version's tarballs here fetches none.
        uses: actions/cache@v6
        with:
          path: .cache/node-runtime
          key: node-runtime-${{ steps.node-runtime.outputs.version }}
          enableCrossOsArchive: true

      - name: Build agent (dry-run)
        # Go cross-compile + Node runtime download + LSP bundle.
        # CGO 미사용이므로 어느 runner에서도 전 플랫폼 빌드 가능.
        env:
          NODE_RUNTIME_VERSION: ${{ steps.node-runtime.outputs.version }}
          NODE_RUNTIME_CACHE_DIR: .cache/node-runtime
        run: bun run scripts/build-agent.ts

      - name: Build renderer (dry-run)
        # electron-vite build — out/ 디렉터리 산출.
        # electron-builder는 실행하지 않는다 (CI 피드백 시간 절약).
        run: bun run build
