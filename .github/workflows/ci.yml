# CI workflow — runs on PRs into main or develop, pushes to main, and by hand.
# electron-builder는 실행하지 않는다. PR 피드백 시간 최소화가 목적.
# build dry-run은 electron-vite build(out/ 산출)까지만 수행.
#
# Every check runs on each desktop OS the app targets. The postinstall step
# rebuilds node-pty and better-sqlite3 against Electron on the runner's own OS,
# so each runner also proves the native modules build there.
#
# Windows is not supported yet (the agent does not build for it), so its job
# reports failures without failing the workflow: each step runs and shows what
# is still broken there.

name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR supersedes the run still going for its last one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]
        include:
          - os: windows-latest
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install JS dependencies
        # --frozen-lockfile: lockfile 변경을 CI에서 허용하지 않는다.
        run: bun install --frozen-lockfile

      - name: Typecheck
        continue-on-error: ${{ matrix.experimental == true }}
        run: bun run typecheck

      - name: Lint
        continue-on-error: ${{ matrix.experimental == true }}
        run: bun run lint

      - name: Test
        continue-on-error: ${{ matrix.experimental == true }}
        run: bun run test

      - name: Test agent
        continue-on-error: ${{ matrix.experimental == true }}
        run: go test ./...

      - name: Build agent (dry-run)
        # Go cross-compile + Node runtime download + LSP bundle.
        # CGO 미사용이므로 어느 runner에서도 전 플랫폼 빌드 가능.
        continue-on-error: ${{ matrix.experimental == true }}
        run: bun run scripts/build-agent.ts

      - name: Build renderer (dry-run)
        # electron-vite build — out/ 디렉터리 산출.
        # electron-builder는 실행하지 않는다 (CI 피드백 시간 절약).
        continue-on-error: ${{ matrix.experimental == true }}
        run: bun run build
