# CI workflow — runs on PRs into main or develop, pushes to main, and by hand.
# electron-builder는 실행하지 않는다. PR 피드백 시간 최소화가 목적.
# build dry-run은 electron-vite build(out/ 산출)까지만 수행.
#
# What can differ between operating systems runs on each desktop OS the app
# targets: the tests, the native modules' build and the renderer's build on
# Windows. What can't — the typecheck, lint and the agent's cross-compile,
# which the release also runs on Ubuntu alone — runs once, beside them.
# Whenever node-pty, better-sqlite3 or Electron changes, each runner builds
# the native modules against Electron on its own OS, proving they build there.

name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR supersedes the run still going for its last one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Typecheck and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install JS dependencies
        # --frozen-lockfile: lockfile 변경을 CI에서 허용하지 않는다.
        # --ignore-scripts: nothing here runs Electron or a native module.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

  # Beside the checks: on Ubuntu the install takes seconds, so the two jobs
  # cost little more than one and finish in about half the time.
  build:
    name: Build (dry-run)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        # For the agent build; the agent's tests have their own job.
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install JS dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Resolve Node runtime version
        id: node-runtime
        run: echo "version=$(bun run scripts/build-agent.ts --print-node-version)" >> "$GITHUB_OUTPUT"

      - name: Cache Node runtimes
        # Downloads from nodejs.org have stalled on runners for minutes on end;
        # a run that finds this version's tarballs here fetches none.
        uses: actions/cache@v6
        with:
          path: .cache/node-runtime
          key: node-runtime-${{ steps.node-runtime.outputs.version }}
          enableCrossOsArchive: true

      - name: Build agent (dry-run)
        # Go cross-compile + Node runtime download + LSP bundle, for every
        # platform: CGO is off, so one runner builds them all, as the release's.
        env:
          NODE_RUNTIME_VERSION: ${{ steps.node-runtime.outputs.version }}
          NODE_RUNTIME_CACHE_DIR: .cache/node-runtime
        run: bun run scripts/build-agent.ts

      - name: Build renderer (dry-run)
        # electron-vite build — out/ 디렉터리 산출.
        run: bun run build

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install JS dependencies
        # --ignore-scripts skips every install script, ours too. The tests
        # need none of the dependencies' ones (Electron is mocked in them),
        # and the costly one was cpu-features (ssh2's optional CPU probe): a
        # node-gyp build of one to two minutes on Windows. The native module
        # steps below are the rest of our postinstall.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Cache native modules
        # The Electron builds of node-pty and better-sqlite3 depend only on
        # their sources, the node-addon-api headers they compile against and
        # Electron's version, so the key hashes those packages' manifests: any
        # other lockfile change keeps the cache, and one of these builds them
        # again on each OS. A hit saves one to two minutes on Windows.
        id: native-modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules/node-pty/build
            node_modules/better-sqlite3/build
          key: native-modules-${{ runner.os }}-${{ hashFiles('node_modules/electron/package.json', 'node_modules/node-pty/package.json', 'node_modules/node-pty/node_modules/node-addon-api/package.json', 'node_modules/better-sqlite3/package.json', 'node_modules/node-addon-api/package.json') }}

      - name: Build native modules
        # Our postinstall's rebuild without cpu-features, which can't be
        # rebuilt once its install script is skipped.
        if: steps.native-modules.outputs.cache-hit != 'true'
        run: bun x electron-rebuild -f -o node-pty,better-sqlite3

      - name: Test
        run: bun run test

  # The renderer's build plugins handle paths, which Windows writes its own
  # way; built beside the Windows tests rather than after them.
  build-windows:
    name: Build renderer (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install JS dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build renderer (dry-run)
        run: bun run build

  # The agent's tests need none of the JS setup, so they run beside the jobs
  # above instead of after them.
  go-test:
    name: Agent tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test agent
        run: go test ./...
