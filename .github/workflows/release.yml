# Release workflow — triggered when a GitHub Release is created (published or pre-release).
# Five-job pipeline:
#   1. build-agent      — ubuntu-latest (produces cross-compiled Go + Node runtime + LSP bundle)
#   2. package          — macos-15 (Apple Silicon arm64 native)
#   3. package-linux    — one runner per architecture (x64, arm64), AppImage + deb
#   4. package-windows  — windows-latest x64, the Microsoft Store AppX
#   5. submit-store     — submits that AppX to the Microsoft Store (not for a pre-release)
#
# Supports Apple Silicon arm64 only. There used to be a macos-13 (Intel x64) matrix entry, but it
# was dropped: the macos-13 runner pool was often stuck in the queue and it was not
# cost-effective for the size of the user base.
# If x64 is needed again it can return as a matrix — but then the `gh release upload` step
# must be redesigned to gather all assets and upload them once, without a race condition
# between matrix jobs.
#
# Publish approach:
#   electron-builder's built-in publish is not used because its draft mode conflicts with an
#   existing published release (it silently skips assets). `--publish never` only produces
#   the dist/ artifacts, and a separate step attaches them explicitly with
#   `gh release upload --clobber`.
#
# Code signing: a self-signed certificate (no Apple Developer ID, no notarization).
# Every release is signed with the same one so that an installed app takes the
# next version in place — Squirrel.Mac accepts an update only when it meets the
# running app's designated requirement, which names this certificate. A release
# signed with another certificate cannot update the ones before it.
#   secrets.MAC_SIGNING_CERT_P12       base64 of the certificate's .p12
#   secrets.MAC_SIGNING_CERT_PASSWORD  its password
#   env.NEXUS_MAC_SIGN_IDENTITY        its SHA-1, pinned so a swapped secret fails
#                                      the release instead of shipping it

name: Release

on:
  release:
    types: [created]

permissions:
  contents: write  # needed for uploading release assets

jobs:
  # ── Job 1: Agent cross-compile ────────────────────────────────────────────
  # Why ubuntu-latest: the agent is built with CGO_ENABLED=0 (static linking), so it is
  # independent of the build host's glibc/OS, and the Node runtime download + LSP bundle are
  # OS-independent too, so any runner works. (Previously linux/amd64 was a native build, so
  # CGO was on and it dynamically linked against the build host's glibc, failing on older
  # distributions with 'GLIBC_x.xx not found' — fixed by forcing CGO_ENABLED=0 in
  # build-agent.ts.)
  # macOS runners cost 10x ubuntu per minute, so the work is done on ubuntu first and then
  # shared as an artifact.
  build-agent:
    name: Build agent (cross-compile)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Resolve Node runtime version
        id: node-runtime
        run: echo "version=$(bun run scripts/build-agent.ts --print-node-version)" >> "$GITHUB_OUTPUT"

      - name: Cache Node runtimes
        # Downloads from nodejs.org have stalled on runners for minutes on end;
        # CI on main fills this cache, so a release usually fetches none.
        uses: actions/cache@v6
        with:
          path: .cache/node-runtime
          key: node-runtime-${{ steps.node-runtime.outputs.version }}
          enableCrossOsArchive: true

      - name: Build agent (all platforms)
        env:
          NODE_RUNTIME_VERSION: ${{ steps.node-runtime.outputs.version }}
          NODE_RUNTIME_CACHE_DIR: .cache/node-runtime
        run: bun run scripts/build-agent.ts

      - name: Upload agent artifact
        uses: actions/upload-artifact@v7
        with:
          name: agent-dist
          path: dist/agent
          # the package job consumes it immediately, so 1 day is enough
          retention-days: 1

  # ── Job 2: Electron packaging (arm64 only) ──────────────────────────────────
  # macos-15 = Apple Silicon native. node-pty/better-sqlite3 are rebuilt for arm64.
  package:
    name: Package (arm64)
    needs: build-agent
    runs-on: macos-15

    env:
      # NEXUS_CHANNEL branch:
      #   prerelease=true  → 'beta'  (a pre-release is delivered to the beta update channel)
      #   prerelease=false → 'stable' (regular release)
      # GitHub Actions ternary expression: `condition && 'true-val' || 'false-val'`
      NEXUS_CHANNEL: ${{ github.event.release.prerelease && 'beta' || 'stable' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # SHA-1 of the release signing certificate ("NexusCode Release Signing").
      NEXUS_MAC_SIGN_IDENTITY: A1FC28A2A25510877EBF48CBB0F65E96504CABD0

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install JS dependencies
        # Runs electron-rebuild -f -w node-pty,better-sqlite3 in postinstall.
        # --frozen-lockfile prevents lockfile changes.
        run: bun install --frozen-lockfile

      - name: Download agent artifact
        uses: actions/download-artifact@v8
        with:
          name: agent-dist
          path: dist/agent

      - name: Build renderer (electron-vite)
        run: bun run build

      - name: Import signing certificate
        # macOS does not trust a self-signed certificate, so electron-builder's
        # identity lookup skips it; scripts/sign-mac.cjs (mac.sign) signs with
        # it by NEXUS_MAC_SIGN_IDENTITY out of this keychain instead.
        env:
          CERT_P12: ${{ secrets.MAC_SIGNING_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MAC_SIGNING_CERT_PASSWORD }}
        run: |
          : "${CERT_P12:?secret MAC_SIGNING_CERT_P12 is not set}"
          : "${CERT_PASSWORD:?secret MAC_SIGNING_CERT_PASSWORD is not set}"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          # codesign --keychain still looks the identity up through the search
          # list ("The specified item could not be found in the keychain").
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          if ! security find-identity -p codesigning "$keychain" | grep -q "$NEXUS_MAC_SIGN_IDENTITY"; then
            echo "::error::the certificate in MAC_SIGNING_CERT_P12 is not $NEXUS_MAC_SIGN_IDENTITY"
            exit 1
          fi
          echo "NEXUS_MAC_SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Package with electron-builder
        # `--publish never` only produces the dist/ artifacts.
        # electron-builder's built-in publish can silently skip assets because of a conflict between
        # an existing published release and draft mode, so it is not trusted. The next step handles
        # attaching.
        run: >
          bun x electron-builder
          --mac dmg zip
          --arm64
          --publish never

      - name: Verify the signature
        # The designated requirement must name the release certificate, or the
        # installed apps cannot update to this release. codesign names a
        # self-signed certificate as the leaf or as the root (it is both),
        # depending on the macOS version.
        run: |
          app="dist/mac-arm64/NexusCode.app"
          codesign --verify --deep --strict "$app"
          requirement="$(codesign -d -r- "$app" 2>&1)"
          echo "$requirement"
          identity="$(echo "$NEXUS_MAC_SIGN_IDENTITY" | tr '[:upper:]' '[:lower:]')"
          echo "$requirement" | grep -Eq "certificate (leaf|root) = H\"$identity\"" \
            || { echo "::error::$app is not signed with the release certificate"; exit 1; }

      - name: Upload assets to release
        # `tag_name` is the release identifier. `--clobber` overwrites an asset of the same name
        # (makes workflow reruns safe). latest-mac.yml is the metadata file electron-updater uses to
        # detect new versions, so it must be uploaded together.
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/*.dmg dist/*.dmg.blockmap \
            dist/*.zip dist/*.zip.blockmap \
            dist/latest-mac.yml \
            --clobber

  # ── Job 3: Electron packaging (Linux) ──────────────────────────────────────
  # One runner per architecture: the postinstall step rebuilds node-pty and
  # better-sqlite3 for the runner's own. The jobs upload no file in common —
  # the update feed is latest-linux.yml for x64 and latest-linux-arm64.yml for
  # arm64 — so they cannot race on an asset. Linux builds are not signed.
  package-linux:
    name: Package (linux-${{ matrix.arch }})
    needs: build-agent
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned, like arm64: the native modules are built against the
          # runner's glibc, and a newer Ubuntu would raise the oldest one
          # the packages load on.
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64

    env:
      NEXUS_CHANNEL: ${{ github.event.release.prerelease && 'beta' || 'stable' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Download agent artifact
        uses: actions/download-artifact@v8
        with:
          name: agent-dist
          path: dist/agent

      - name: Build renderer (electron-vite)
        run: bun run build

      - name: Package with electron-builder
        run: >
          bun x electron-builder
          --linux AppImage deb
          --${{ matrix.arch }}
          --publish never

      - name: Upload assets to release
        # latest-linux*.yml is the update feed the AppImage reads.
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/*.AppImage dist/*.deb \
            dist/latest-linux*.yml \
            --clobber

  # ── Job 4: Microsoft Store package (Windows x64) ────────────────────────
  # Job 5 submits the AppX to the Store. It is unsigned, as the Store signs
  # what it publishes, so it stays a workflow artifact: nobody could install
  # it from the release page. The Store updates its installs, so there is no
  # update feed to upload either.
  package-windows:
    name: Package (windows-x64, Microsoft Store)
    needs: build-agent
    runs-on: windows-latest

    env:
      NEXUS_CHANNEL: ${{ github.event.release.prerelease && 'beta' || 'stable' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Download agent artifact
        uses: actions/download-artifact@v8
        with:
          name: agent-dist
          path: dist/agent

      - name: Build renderer (electron-vite)
        run: bun run build

      - name: Package with electron-builder
        run: >
          bun x electron-builder
          --win appx
          --x64
          --publish never

      - name: Upload the Store package
        uses: actions/upload-artifact@v7
        with:
          name: msstore-appx-${{ github.event.release.tag_name }}
          path: dist/*.appx
          # Long enough for certification and a resubmission.
          retention-days: 30
          # An AppX is already a zip.
          compression-level: 0

  # ── Job 5: Microsoft Store submission ───────────────────────────────────
  # Submits the AppX for certification, with the release notes in
  # build/store-release-notes.json; once it passes, the Store updates its
  # installs. A pre-release builds the beta channel, which the Store doesn't
  # carry. The Store CLI signs in as a Microsoft Entra application with the
  # Manager role in Partner Center (docs/RELEASING.md):
  #   secrets.MSSTORE_TENANT_ID, MSSTORE_CLIENT_ID, MSSTORE_CLIENT_SECRET
  #   secrets.MSSTORE_SELLER_ID
  # Don't re-run this job once it has submitted: it would replace the
  # submission under certification.
  submit-store:
    name: Submit to the Microsoft Store
    needs: package-windows
    if: ${{ !github.event.release.prerelease }}
    runs-on: windows-latest
    # The CLI waits on a prompt forever if it ever asks for one.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Download the Store package
        uses: actions/download-artifact@v8
        with:
          name: msstore-appx-${{ github.event.release.tag_name }}
          path: store-package

      - name: Setup the Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.4
        with:
          version: v0.4.3

      - name: Sign in to Partner Center
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        run: >
          msstore reconfigure
          --tenantId "$env:MSSTORE_TENANT_ID"
          --sellerId "$env:MSSTORE_SELLER_ID"
          --clientId "$env:MSSTORE_CLIENT_ID"
          --clientSecret "$env:MSSTORE_CLIENT_SECRET"

      - name: Submit
        run: bun run scripts/store-submit.ts --package-dir store-package
